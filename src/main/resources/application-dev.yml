spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cloudims
    username: ${DB_USERNAME:cloudims}
    password: ${DB_PASSWORD:cloudims}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.joshuawilliams.ims: DEBUG